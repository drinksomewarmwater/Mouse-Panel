<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本月流量</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1419; color: #e6e6e6; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 16px; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b98a5; font-size: 13px; margin-bottom: 24px; }
  .big { font-size: 42px; font-weight: 700; }
  .bar { height: 10px; background: #2a3444; border-radius: 999px; overflow: hidden; margin: 20px 0 8px; }
  .bar i { display: block; height: 100%; background: #1d9bf0; }
  .row { display: flex; gap: 12px; margin-top: 20px; }
  .row div { flex: 1; background: #1a2230; border: 1px solid #2a3444; border-radius: 10px; padding: 12px; }
  .k { color: #8b98a5; font-size: 12px; }
  .v { font-size: 20px; margin-top: 4px; }
  .hint { color: #8b98a5; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>本月流量</h1>
  <div class="sub"><span id="domain">—</span> · <span id="quota">每月 —</span> · <span id="updated">加载中…</span></div>
  <div class="big" id="total">…</div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="hint" id="note">…</div>
  <div class="row">
    <div><div class="k">入站</div><div class="v" id="rx">…</div></div>
    <div><div class="k">出站</div><div class="v" id="tx">…</div></div>
    <div><div class="k">剩余额度</div><div class="v" id="left">…</div></div>
  </div>
  <div class="hint">数据每 5 分钟更新</div>
</div>
<script>
function fmtGB(b){ return (b/1e9).toFixed(2)+' GB'; }
fetch('traffic.json', {cache:'no-store'})
  .then(function(r){ return r.json(); })
  .then(function(d){
    var t=d.traffic||{};
    var total=(t.rx||0)+(t.tx||0);
    var quota=(d.quota_gb!=null&&d.quota_gb>0)?d.quota_gb:null;
    document.getElementById('domain').textContent=d.domain||'—';
    document.getElementById('quota').textContent=quota?('每月 '+quota+' GB'):'流量不限';
    document.getElementById('updated').textContent='更新于 '+(d.updated||'—');
    document.getElementById('total').textContent=quota?(fmtGB(total)+' / '+quota+' GB'):fmtGB(total);
    var pct=quota?total/(quota*1e9)*100:0;
    document.getElementById('bar').style.width=Math.min(pct,100)+'%';
    document.getElementById('note').textContent='本月 '+(t.month||'—')+(quota?(' · 已用 '+pct.toFixed(2)+'%'):'');
    document.getElementById('rx').textContent=fmtGB(t.rx||0);
    document.getElementById('tx').textContent=fmtGB(t.tx||0);
    document.getElementById('left').textContent=quota?(Math.max(0,quota-total/1e9).toFixed(2)+' GB'):'不限';
  })
  .catch(function(){
    document.getElementById('total').textContent='加载失败，请刷新重试';
  });
</script>
</body>
</html>
